[package]
name = "alfred_flutter_docs"
version = "2.2.4"
edition = "2024"
rust-version = "1.88"
description = "Search the Flutter documentation using Alfred."
license = "MIT"
publish = false

[dependencies]
alfred_workflow_rs = "1.0.1"
anyhow = "1.0"
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3.4.0", features = ["platform-verifier"] }
url = "2.5"

[dev-dependencies]
tempfile = "3.10"
flate2 = "1.1"
